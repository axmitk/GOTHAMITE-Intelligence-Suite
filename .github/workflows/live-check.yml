name: Live prototype check

# Pings https://gothamite.onrender.com often enough that the free Render
# instance does not sleep (it sleeps after ~15 min idle), and fails loudly if
# the deployed demo is broken. Runs 07:30–22:30 IST to stay inside the free
# Actions minutes of a private repo; run it manually any time from the Actions tab.
on:
  schedule:
    - cron: "*/14 2-16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live prototype
        run: python scripts/check_live.py https://gothamite.onrender.com
