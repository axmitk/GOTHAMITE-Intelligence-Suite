services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gothamite-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/gothamite.db
      - GOTHAMITE_DB_PATH=/app/data/gothamite.db
    volumes:
      - gothamite-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gothamite-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - DATABASE_URL=sqlite:////app/data/gothamite.db
      - GOTHAMITE_DB_PATH=/app/data/gothamite.db
    volumes:
      - gothamite-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gothamite-data:
