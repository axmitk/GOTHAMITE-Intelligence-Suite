# Phase-4 mock sites: forum-alpha, marketplace-beta, forum-gamma.
#
# Layered on top of the root compose file, which owns the directory, the relay
# pool and the sandbox-net network:
#
#   docker compose -f docker-compose.yml -f mock_sites/docker-compose.sites.yml up -d
#
# sandbox-net is declared external here and named explicitly in the root file
# (SPEC_DECISIONS.md SD-010), so both files resolve the same network.
#
# No service below publishes a host port. That is not an oversight -- it is
# MOCK_SITES_SPEC.md section 7 criterion 2: the sites must be unreachable except
# through the relay chain, and curl from the host must fail. Adding a ports:
# entry to any of these services breaks a Phase-4 acceptance criterion.

services:
  forum-alpha: &site
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forum-alpha
    command: python -m mock_sites.site_server
    environment: &site-env
      SITE_ID: forum-alpha
      SITE_BIND: "0.0.0.0"
      SITE_PORT: "80"
    networks: [sandbox-net]
    healthcheck: &site-health
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:80/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  marketplace-beta:
    <<: *site
    container_name: marketplace-beta
    environment:
      <<: *site-env
      SITE_ID: marketplace-beta

  forum-gamma:
    <<: *site
    container_name: forum-gamma
    environment:
      <<: *site-env
      SITE_ID: forum-gamma

  forum-delta:
    <<: *site
    container_name: forum-delta
    environment:
      <<: *site-env
      SITE_ID: forum-delta

  marketplace-epsilon:
    <<: *site
    container_name: marketplace-epsilon
    environment:
      <<: *site-env
      SITE_ID: marketplace-epsilon

  forum-zeta:
    <<: *site
    container_name: forum-zeta
    environment:
      <<: *site-env
      SITE_ID: forum-zeta

  marketplace-omega:
    <<: *site
    container_name: marketplace-omega
    environment:
      <<: *site-env
      SITE_ID: marketplace-omega

networks:
  sandbox-net:
    external: true
    name: sandbox-net
